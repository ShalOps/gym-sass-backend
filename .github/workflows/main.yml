name: Deploy Fitness SaaS API

on:
  push:
    branches:
      - staging

jobs:
  deploy_staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect with VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            ROOT_DIR=~/apps/fitness-saas
            APP_DIR="$ROOT_DIR/fitness-platform"
            APP_NAME=fitness-saas
            PORT=64389

            mkdir -p "$ROOT_DIR"
            cd "$ROOT_DIR"

            if [ -d ".git" ]; then
              git stash
              git pull origin staging
            else
              git clone -b staging https://github.com/ShalOps/gym-sass-backend.git .
            fi

            cd "$APP_DIR"

            echo "Installing dependencies..."
            npm ci

            echo "Running Prisma..."
            npx prisma generate
            npx prisma migrate deploy
            
            # Build the application
            npm run build

            pid=$(pm2 pid "fitness-saas" 2>/dev/null)
            if [ -n "$pid" ]; then
              echo "Reloading fitness-saas"
              pm2 reload "fitness-saas"
              pm2 save
            else
              echo "Starting PM2 process..."
              PORT=$PORT pm2 start npm \
                --name "$APP_NAME" \
                --cwd "$APP_DIR" \
                -- start
            fi

            pm2 save
            echo "Deployment completed successfully"

name: Deploy Fitness SaaS

on:
  push:
    branches:
      - staging

jobs:
  deploy_staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Connect with VPS and deploy
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SSH_PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} bash -s <<'EOF'
            mkdir -p apps/fitness-saas && cd apps/fitness-saas

            if [ -d ".git" ]; then
              git stash
              git pull origin staging
            else
              git clone -b staging git@github.com:ShalOps/gym-sass-backend.git .
            fi

            npm install --force

            # Run Prisma migrations
            npx prisma generate
            npx prisma db push

            # Build the application
            npm run build

            pid=$(pm2 pid "fitness-saas" 2>/dev/null)
            if [ -n "$pid" ]; then
              echo "Reloading fitness-saas"
              pm2 reload "fitness-saas"
              pm2 save
            else
              echo "Starting new application"
              PORT=45235 pm2 start npm --name "fitness-saas" -- start
              pm2 startup
              pm2 save
            fi
          EOF
